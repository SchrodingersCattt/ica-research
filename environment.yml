name: ica-research
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - ase=3.28.0
  - pymatgen
  - seekpath
  - phonopy=2.41.1
  - dpdata
  - pillow
  - gemmi
  - pip

# Reference production runtime recorded in run_2609.log:
#   Python 3.11
#   ASE 3.28.0
#   DeepMD-kit 3.1.3.dev21+gb98f6c596
#   Phonopy 2.41.1
